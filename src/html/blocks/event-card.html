<article class="event-card @@class">
  <a href="#" class="event-card__link">

    <picture class="event-card__picture">
      <source type="image/webp" media="(max-width: 669px)" srcset="@@img__mobile_webp"/>
      <source media="(max-width: 669px)" srcset="@@img__mobile"/>

      <source type="image/webp" media="(max-width: 1019px)" srcset="@@img__tablet_webp"/>
      <source media="(max-width: 1019px)" srcset="@@img__tablet"/>

      <source type="image/webp" srcset="@@img__webp"/>
      <img src="@@img" alt="@@alt" class="event-card__img" />
    </picture>

    <h4 class="event-card__title">
      @@title
    </h4>

    <p class="event-card__description">
      @@descr
    </p>

    <time datetime="@@datetime" class="event-card__time">
        @@time
    </time>

  </a>
</article>
